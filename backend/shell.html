<style>
  /* Pre-boot paint. Without this the WebView shows white for the moment before
     the bundle parses, which reads as a crash on a slow site connection. */
  html,body{margin:0;height:100%;background:#F3F4F7}
  @media (prefers-color-scheme: dark){html,body{background:#0A0D13}}
  #plm-boot{position:fixed;inset:0;display:grid;place-items:center}
  #plm-boot .m{width:64px;height:64px;border-radius:20px;
    background:linear-gradient(150deg,#6D5EF6,#4A3CD0);
    box-shadow:0 6px 18px rgba(109,94,246,.4);
    animation:plmp 1.4s ease-in-out infinite}
  @keyframes plmp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.92);opacity:.75}}
</style>
</head>
<body>
<div id="plm-root"><div id="plm-boot"><div class="m"></div></div></div>

<script>
  /* Frappe rewrites the comment below into `frappe.csrf_token = "…"`, so the
     global it assigns to has to exist first. This is the whole reason this page
     needs no Python controller: the token arrives without one. */
  window.frappe = window.frappe || {};
</script>
<!-- csrf_token -->
<script>
  window.PLM_BOOT = {
    csrf_token: (window.frappe && window.frappe.csrf_token) || '',
    user: '',
    full_name: '',
    site: location.host,
    build: '__BUILD__'
  };
  window.csrf_token = window.PLM_BOOT.csrf_token;
</script>
<script src="/assets/pipe_laying_inhouse/plm/index.js?v=__BUILD__" defer></script>
</body>
</html>
