<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipe Laying</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:#F3F4F7;color:#1A2030;display:grid;place-items:center;text-align:center;padding:24px}
  @media (prefers-color-scheme:dark){html,body{background:#0A0D13;color:#E8EAF1}}
  .m{width:64px;height:64px;border-radius:20px;margin:0 auto 18px;
    background:linear-gradient(150deg,#6D5EF6,#4A3CD0);box-shadow:0 6px 18px rgba(109,94,246,.4)}
  h1{font-size:20px;font-weight:650;margin:0 0 8px}
  p{font-size:14px;line-height:1.55;color:#586273;margin:0 0 20px;max-width:34ch}
  @media (prefers-color-scheme:dark){p{color:#9AA3B7}}
  a{display:inline-block;padding:13px 26px;border-radius:999px;text-decoration:none;
    font-weight:600;font-size:15px;color:#fff;background:linear-gradient(150deg,#6D5EF6,#4A3CD0)}
</style>
</head>
<body>
<!-- Capacitor requires a webDir, but this file is NOT the app.
     capacitor.config.json sets server.url, so the shell loads the hosted SPA
     directly — that is what makes every server deploy reach every phone with no
     APK rebuild. This page only ever appears if server.url could not be reached
     on a first-ever launch, before the service worker had a chance to cache the
     app. -->
<div>
  <div class="m"></div>
  <h1>Pipe Laying</h1>
  <p>Could not reach the server. Connect to the internet once, then reopen the app — after that it works offline.</p>
  <a href="https://jewipl.duxdigitech.in/pipe-laying/m">Try again</a>
</div>
</body>
</html>
